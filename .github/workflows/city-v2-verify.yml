name: City V2 verification
on:
  pull_request:
    branches: [claude/native-fixes]
    paths: ['tools/city-v2/**', '.github/workflows/city-v2-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: city-v2-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct pinned sources and prepare City V2
        run: |
          python3 tools/city-v2/reconstruct.py build-js
          unzip -q Mercury_Native_Map_Checkpoint.zip -d build
          node tools/city-v2/prepare.mjs build-js build/native-map
          node tools/city-v2/build.mjs build/native-map
      - name: JS and generator gates
        run: |
          node --test tools/city-v2/generate.test.mjs
          cd build-js
          npm test
      - name: Godot and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          curl -fLsS -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Native audit and long shifts
        run: |
          "$GODOT_BIN" --headless --editor --path build/native-map --import
          python3 build/native-map/tools/audit_migration.py --godot "$GODOT_BIN" --jobs 2
          cd build/native-map
          "$GODOT_BIN" --headless --path . --script tools/verify_city_v2_country.gd
          node tools/audit_service_long_shift.mjs
          "$GODOT_BIN" --headless --path . --script tools/audit_service_long_shift.gd
      - name: Portrait and landscape captures
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          node tools/city-v2/render-saves.mjs build-js render-saves
          for size in 369x905 905x369; do
            out="$GITHUB_WORKSPACE/captures/$size"
            mkdir -p "$out/screens" "$out/camera"
            xvfb-run -a "$GODOT_BIN" --path build/native-map --rendering-driver opengl3 --resolution "$size" --script scripts/render_screens.gd -- --native-ui --out "$out/screens"
            for condition in day night snow; do
              mkdir -p "$out/$condition"
              xvfb-run -a "$GODOT_BIN" --path build/native-map --rendering-driver opengl3 --resolution "$size" --script scripts/render_camera.gd -- --native-ui --out "$out/$condition" --storage "$GITHUB_WORKSPACE/render-saves/$condition.json" --world '0:0:0;600:-1200:-2;1200:-480:-1;2400:-1440:-1'
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-v2-verification
          path: |
            captures/
            build/native-map/audit/*.log
            build/native-map/audit/migration-audit.json
          retention-days: 14
