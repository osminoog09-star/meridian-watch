# Claude 17.10: the native Android APK builds itself on every push of the native checkpoint (owner 16.10: «чтобы APK
# сам правильно собирался»). Result: a GitHub pre-release «apk-<versionCode>» with the APK and its SHA-256.
# Signing: repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS — the SAME key as
# the published APKs (an APK with another key cannot update the installed game). Without the secrets the APK is signed
# with a throw-away CI key and marked «TEST — не ставить поверх».
name: Android APK
on:
  push:
    branches: [claude/native-fixes]
    paths: ['Mercury_Native_Map_Checkpoint.zip','.github/workflows/android-apk.yml','ci/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
env:
  GODOT: 4.7.2
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Android SDK packages (preinstalled SDK on the runner)
        run: |
          SM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME/build-tools | tail -3; ls $ANDROID_HOME/platforms | tail -3
          yes | $SM --licenses >/dev/null || true
          $SM "platform-tools" "platforms;android-35" "build-tools;35.0.0" > $RUNNER_TEMP/sdk.log 2>&1 || { echo "::error::sdkmanager: $(tail -3 $RUNNER_TEMP/sdk.log | tr '\n' ' ')"; exit 1; }
      - name: Godot and export templates
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSLo g.zip https://github.com/godotengine/godot-builds/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_linux.x86_64.zip
          unzip -q g.zip && mv Godot_v${GODOT}-stable_linux.x86_64 godot && chmod +x godot
          curl -sSLo t.tpz https://github.com/godotengine/godot-builds/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates && unzip -q t.tpz -d ~/.local/share/godot/export_templates
          mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/${GODOT}.stable
      - name: Unpack the native project
        run: unzip -q Mercury_Native_Map_Checkpoint.zip -d build && ls build/native-map | head
      - name: Build the MercuryAndroid bridge from source (updater, migration, device metrics)
        shell: bash
        run: |
          mkdir -p $RUNNER_TEMP/bridge && cd $RUNNER_TEMP/bridge
          unzip -q ~/.local/share/godot/export_templates/${GODOT}.stable/android_source.zip -d src
          AAR=$(find src -name "godot-lib*release*.aar" | head -1); echo "::notice::godot-lib: $AAR"
          curl -sSLo ecj.jar https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/3.33.0/ecj-3.33.0.jar
          export ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar ANDROID_LAMBDA_STUBS=$ANDROID_HOME/build-tools/35.0.0/core-lambda-stubs.jar GODOT_ANDROID_AAR=$AAR ECJ_JAR=$PWD/ecj.jar
          python3 $GITHUB_WORKSPACE/build/native-map/android-bridge/build.py > bridge.log 2>&1 || { echo "::error::bridge: $(tail -20 bridge.log | tr '\n' ' ' | cut -c1-1500)"; exit 1; }
          ls -la $GITHUB_WORKSPACE/build/native-map/addons/mercury_android/MercuryAndroid.aar
      - name: Version
        id: v
        run: |
          code=$((100 + GITHUB_RUN_NUMBER))
          echo "code=$code" >> $GITHUB_OUTPUT
          echo "name=0.3.$GITHUB_RUN_NUMBER-native" >> $GITHUB_OUTPUT
      - name: Keystore
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] && [ -f ci/signing/mercury-release.keystore ]; then
            # the project key made on the owner's request 16.10 (kept in this private repository; move it to Secrets when possible)
            KS=$(base64 -w0 ci/signing/mercury-release.keystore); KS_PASS=$(python3 -c "import json;print(json.load(open('ci/signing/signing.json'))['password'])"); KS_ALIAS=$(python3 -c "import json;print(json.load(open('ci/signing/signing.json'))['alias'])")
          fi
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > $RUNNER_TEMP/release.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KS_ALIAS" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "official=yes" >> $GITHUB_OUTPUT
          else
            keytool -genkeypair -keystore $RUNNER_TEMP/test.keystore -alias test -keyalg RSA -keysize 2048 -validity 3650 -storepass testtest -keypass testtest -dname "CN=Mercury CI test" -noprompt
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/test.keystore" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=test" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=testtest" >> $GITHUB_ENV
            echo "official=no" >> $GITHUB_OUTPUT
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — the APK is signed with a TEST key and cannot update the installed game."
          fi
      - name: Export
        shell: bash
        run: |
          cd build/native-map
          export XDG_CONFIG_HOME=$RUNNER_TEMP/config
          python3 ../../ci/android_presets.py . --version-code ${{ steps.v.outputs.code }} --version-name ${{ steps.v.outputs.name }} --out $GITHUB_WORKSPACE/out/mercury.apk --config $XDG_CONFIG_HOME
          mkdir -p $GITHUB_WORKSPACE/out
          step(){ name=$1; shift; start=$(date +%s); rc=0; timeout $1 "${@:2}" > $RUNNER_TEMP/$name.log 2>&1 || rc=$?; echo "::notice::$name: exit $rc after $(($(date +%s)-start)) s; tail: $(tail -6 $RUNNER_TEMP/$name.log | tr '\n' ' ' | cut -c1-900)"; return 0; }
          step import 900 ~/godot/godot --headless --path . --import
          step export 1500 ~/godot/godot --headless --path . --install-android-build-template --export-release "Android" $GITHUB_WORKSPACE/out/mercury.apk
          if [ ! -s $GITHUB_WORKSPACE/out/mercury.apk ]; then
            grep -iE "error|fail|exception|could not|unable" $RUNNER_TEMP/export.log | head -25 | while read -r l; do echo "::error::$l"; done
            echo "::error::export log tail: $(tail -15 $RUNNER_TEMP/export.log | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
      - name: Check the APK
        id: check
        run: |
          BT=$ANDROID_HOME/build-tools/35.0.0
          $BT/apksigner verify --print-certs out/mercury.apk | tee out/certificate.txt
          # the published APKs (13, 14) are signed with this certificate; another key cannot update the installed game
          OFFICIAL="0fdf02f8d7e3aaa79d0d571d46da8689b8a83348cd10df32267bdc786777232b 601ca75c9085929a09d63117ba5462b2e12b01f2be183ba742b5b8c19a5ce358"
          got=$(grep -i "SHA-256 digest" out/certificate.txt | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          echo "::notice::certificate SHA-256 $got"
          if [ "${{ steps.key.outputs.official }}" = "yes" ] && ! echo "$OFFICIAL" | grep -qw "$got"; then echo "::error::the keystore in the secrets is not the key of the published APKs"; exit 1; fi
          $BT/aapt dump badging out/mercury.apk | head -3 | tee out/badging.txt
          unzip -l out/mercury.apk | grep -E "libmercury_quickjs|classes.dex" | tee out/contents.txt
          grep -q libmercury_quickjs out/contents.txt
          name=Mercury_Response_${{ steps.v.outputs.code }}${{ steps.key.outputs.official == 'yes' && '' || '_TEST' }}.apk
          mv out/mercury.apk out/$name && (cd out && sha256sum $name | tee $name.sha256)
          echo "file=$name" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.v.outputs.code }}
          path: out/
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk-${{ steps.v.outputs.code }} out/${{ steps.check.outputs.file }} out/${{ steps.check.outputs.file }}.sha256 \
            --prerelease --target ${{ github.sha }} --title "APK ${{ steps.v.outputs.code }} (${{ steps.v.outputs.name }})${{ steps.key.outputs.official == 'yes' && '' || ' — TEST, другой ключ' }}" \
            --notes "Собрано автоматически из ${{ github.sha }} (claude/native-fixes). Ключ: ${{ steps.key.outputs.official == 'yes' && 'основной' || 'ТЕСТОВЫЙ — не ставить поверх установленной игры' }}. Сертификат: $(head -2 out/certificate.txt | tr '\n' ' ')"
      - name: Update channel (public repository osminoog09-star/meridian-watch-apk)
        if: steps.key.outputs.official == 'yes'
        shell: bash
        run: |
          if [ ! -f ci/signing/deploy_ed25519 ]; then echo "::notice::no deploy key — the update channel is not set up"; exit 0; fi
          mkdir -p ~/.ssh && cp ci/signing/deploy_ed25519 ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519 && ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          if ! git ls-remote git@github.com:osminoog09-star/meridian-watch-apk.git >/dev/null 2>&1; then echo "::warning::update channel: create the public repository osminoog09-star/meridian-watch-apk and add ci/signing/deploy_ed25519.pub as a deploy key with write access (see AUTO_APK.md)"; exit 0; fi
          F=${{ steps.check.outputs.file }}; mkdir -p channel/android && cp out/$F channel/android/
          python3 ci/channel.py channel out/$F ${{ steps.v.outputs.code }} ${{ steps.v.outputs.name }}
          cd channel && git init -q -b main && git add -A && git -c user.name="Mercury CI" -c user.email=ci@users.noreply.github.com commit -qm "APK ${{ steps.v.outputs.code }}" && git push -qf git@github.com:osminoog09-star/meridian-watch-apk.git main
          echo "::notice::update channel: APK ${{ steps.v.outputs.code }} published"
